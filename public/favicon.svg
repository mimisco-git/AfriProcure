<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917" />
      <stop offset="50%" stop-color="#0c0a09" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="steelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#F59E0B" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Rounded App Tile Background -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)" stroke="#44403c" stroke-width="1" />

  <!-- Outer Statutory Hexagonal Perimeter with chamfered geometry -->
  <path
    d="M32 6 L52 14 V32 C52 44.5 43.5 54.5 32 58 C20.5 54.5 12 44.5 12 32 V14 L32 6 Z"
    stroke="url(#goldGrad)"
    stroke-width="2.2"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Subtle interior audit circle -->
  <circle
    cx="32"
    cy="32"
    r="18"
    stroke="#57534e"
    stroke-width="1.2"
    stroke-dasharray="3 3"
    opacity="0.6"
  />

  <!-- Architecture Infrastructure Pylons (The letter 'A') -->
  <path
    d="M20 46 L30.5 17 H33.5 L44 46"
    stroke="url(#steelGrad)"
    stroke-width="3.6"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Footings -->
  <path
    d="M17 46 H24 M40 46 H47"
    stroke="url(#goldGrad)"
    stroke-width="2.5"
    stroke-linecap="round"
  />

  <!-- CPA Fluctuation Balance Beam -->
  <path
    d="M24 35 H40"
    stroke="url(#goldGrad)"
    stroke-width="3"
    stroke-linecap="round"
    filter="url(#goldGlow)"
  />

  <!-- Keystone Diamond -->
  <path
    d="M32 13 L36 18 L32 23 L28 18 Z"
    fill="url(#goldGrad)"
  />

  <!-- Statutory Green Node -->
  <circle
    cx="32"
    cy="41"
    r="2.5"
    fill="url(#emeraldGrad)"
  />
</svg>
